name: sync-public
# Every push to main in the private repo publishes the same files to the public repo.
# Needs: secret PUBLIC_REPO_TOKEN (fine-grained token with Contents: read and write on the public repo)
#        variable PUBLIC_REPO (for example "lenzo3D/np-jarvis-public")
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: sync-public
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        env:
          PUBLIC_REPO: ${{ vars.PUBLIC_REPO }}
          TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          [ -n "$PUBLIC_REPO" ] && [ -n "$TOKEN" ] || { echo "::error::Set the PUBLIC_REPO variable and PUBLIC_REPO_TOKEN secret (see docs/PUBLISHING.md)"; exit 1; }
      - name: Publish
        env:
          PUBLIC_REPO: ${{ vars.PUBLIC_REPO }}
          TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}
        run: scripts/sync_public.sh "https://x-access-token:${TOKEN}@github.com/${PUBLIC_REPO}.git" "$(printf '%s' "${MSG:-Update}" | head -n1)"
