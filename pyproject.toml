[project]
name = "politemalljarvis"
version = "0.1.0"
description = "JARVIS: personal school assistant for POLITEMall, Teams and Telegram"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.48",
  "httpx>=0.27",
  "python-telegram-bot>=21,<22",
  "apscheduler>=3.10,<4",
  "telethon>=1.36",
  "mcp>=2.3,<3",
  "aiohttp>=3.9",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "pdfplumber>=0.11",
  "google-auth>=2.30",
  "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "ops", "school_mcp", "ui"]

[tool.setuptools.package-data]
ops = ["prompts/*.md"]
ui = ["static/*", "static/fonts/*"]
